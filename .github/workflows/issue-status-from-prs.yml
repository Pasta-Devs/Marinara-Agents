name: Issue Status From Pull Requests

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review, closed]
    branches: [staging, main]

concurrency:
  group: issue-status-from-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-linked-issues:
    name: Update linked issue status
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Label linked issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const labels = {
              'in-pr': { color: '1d76db', description: 'Has an open pull request targeting staging' },
              'fixed-in-staging': {
                color: '0e8a16',
                description: 'Already fixed in staging and is pending closure when staging is promoted to main',
              },
            };
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const targetsStaging = pr.base?.ref === 'staging';
            const targetsMain = pr.base?.ref === 'main';
            const isTrustedMainPromotion =
              targetsMain &&
              pr.state === 'closed' &&
              pr.merged &&
              pr.user?.login === 'SpicyMarinara' &&
              pr.head?.repo?.full_name === `${owner}/${repo}` &&
              pr.head?.ref === 'staging';

            function linkedIssueNumbers(body) {
              const numbers = new Set();
              const closingLines = String(body || '').match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)(?:[^.\n]*)/gi) || [];
              for (const line of closingLines) {
                const references = line.matchAll(/(?:(?<owner>[\w.-]+)\/(?<repo>[\w.-]+))?#(?<number>\d+)/g);
                for (const reference of references) {
                  const targetOwner = reference.groups.owner;
                  const targetRepo = reference.groups.repo;
                  if (targetOwner && (targetOwner.toLowerCase() !== owner.toLowerCase() || targetRepo.toLowerCase() !== repo.toLowerCase())) continue;
                  numbers.add(Number(reference.groups.number));
                }
              }
              return [...numbers];
            }

            async function ensureLabel(name) {
              const opts = { owner, repo };
              try {
                await github.rest.issues.createLabel({ ...opts, name, ...labels[name] });
              } catch (error) {
                if (error.status === 422) {
                  await github.rest.issues.updateLabel({ ...opts, name, ...labels[name] });
                  return;
                }
                throw error;
              }
            }

            async function addLabel(issueNumber, name) {
              await ensureLabel(name);
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [name] });
            }

            async function removeLabel(issueNumber, name) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            async function openStagingPrIssues() {
              const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'staging', per_page: 100 });
              return new Set(pulls.flatMap((pull) => linkedIssueNumbers(pull.body)));
            }

            const activeStagingPrIssues = await openStagingPrIssues();

            if (isTrustedMainPromotion) {
              const fixedInStaging = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'all',
                labels: 'fixed-in-staging',
                per_page: 100,
              });
              for (const issue of fixedInStaging) {
                if (issue.pull_request) continue;
                await removeLabel(issue.number, 'fixed-in-staging');
                await removeLabel(issue.number, 'in-pr');
              }
            }

            for (const issueNumber of linkedIssueNumbers(pr.body)) {
              const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber }).catch((error) => {
                if (error.status === 404) return null;
                throw error;
              });
              if (!issue || issue.data.pull_request) continue;

              if (targetsMain) {
                continue;
              }

              if (!targetsStaging) continue;

              if (pr.state === 'closed') {
                if (pr.merged && issue.data.state === 'open') {
                  await addLabel(issueNumber, 'fixed-in-staging');
                }
                if (!activeStagingPrIssues.has(issueNumber)) await removeLabel(issueNumber, 'in-pr');
              } else if (issue.data.state === 'open') {
                await addLabel(issueNumber, 'in-pr');
              }
            }

            await ensureLabel('in-pr');
            await ensureLabel('fixed-in-staging');
            const labeled = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', labels: 'in-pr', per_page: 100 });
            for (const issue of labeled) {
              if (!issue.pull_request && !activeStagingPrIssues.has(issue.number)) await removeLabel(issue.number, 'in-pr');
            }
