name: Gacha Forge Feature Browser

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/gacha-forge-browser.yml"
      - "artifacts/gacha-forge-*.zip"
      - "packages/gacha-forge/**"
      - "sources/forge-kit/**"
      - "scripts/install-package-browser-fixture.mjs"
      - "scripts/run-package-browser-tests.mjs"
      - "scripts/start-package-browser-servers.mjs"
      - "tests/package-gacha-forge-unit-art.e2e.ts"
      - "tests/package-gacha-forge-units.e2e.ts"
      - "tests/package-gacha-forge-signature-weapons.e2e.ts"
      - "tests/package-gacha-forge-seasonal-events.e2e.ts"
      - "tests/package-gacha-forge-formation*.e2e.ts"
      - "tests/package-gacha-forge-editors.e2e.ts"
      - "tests/package-gacha-forge-proactive-messages.e2e.ts"
      - "tests/package-gacha-forge-backgrounds.e2e.ts"
      - "tests/package-gacha-forge-choice-plan-reload.e2e.ts"
      - "tests/package-gacha-forge-keep-playing.e2e.ts"
      - "tests/package-gacha-forge-audio.e2e.ts"
      - "tests/playwright.package.config.ts"
      - "tests/playwright.gacha-forge.config.ts"
      - "tests/fixtures/gacha-forge-*.mjs"

concurrency:
  group: gacha-forge-browser-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gacha-forge-browser:
    name: Gacha Forge feature browser (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [core, audio]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Marinara Agents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Marinara Engine staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pasta-Devs/Marinara-Engine
          ref: staging
          path: engine
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: engine/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install package runner dependencies
        run: npm ci

      - name: Install Engine dependencies
        run: pnpm --dir engine install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run installed Gacha Forge feature browser proofs
        env:
          MARINARA_ENGINE_ROOT: ${{ github.workspace }}/engine
          GACHA_BROWSER_SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          shopt -s nullglob
          suites=()
          if [[ "$GACHA_BROWSER_SUITE" == "audio" ]]; then
            export TTS_LOCAL_URLS_ENABLED=true
            suites=(tests/package-gacha-forge-audio.e2e.ts)
          else
            for suite in tests/package-gacha-forge-unit-art.e2e.ts tests/package-gacha-forge-units.e2e.ts tests/package-gacha-forge-signature-weapons.e2e.ts tests/package-gacha-forge-seasonal-events.e2e.ts tests/package-gacha-forge-formation*.e2e.ts tests/package-gacha-forge-editors.e2e.ts tests/package-gacha-forge-proactive-messages.e2e.ts tests/package-gacha-forge-backgrounds.e2e.ts tests/package-gacha-forge-choice-plan-reload.e2e.ts tests/package-gacha-forge-keep-playing.e2e.ts; do
              if [[ -f "$suite" ]]; then suites+=("$suite"); fi
            done
          fi
          test "${#suites[@]}" -gt 0
          node scripts/run-package-browser-tests.mjs gacha-forge "${suites[@]}" --workers=2

      - name: Upload Gacha Forge browser proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gacha-forge-browser-proof-${{ matrix.suite }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
