name: Pull Request Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: agent-catalog-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  catalog-validate:
    name: Catalog validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run check

      - name: Check package source names
        run: npm run typecheck:packages

      - name: Test the package typecheck fails without tsc
        run: node scripts/tests/typecheck-packages-missing-tsc.regression.mjs

      - name: Test package security invariants
        run: npm run test:security

      - name: Test Calls autoplay recovery
        run: npx tsx tests/calls-playback.regression.ts

      - name: Test Calls speech-to-text server fallback and speech queue
        run: npx tsx tests/calls-speech-to-text.regression.ts

      - name: Test Calls mic clips and media uploads
        run: npx tsx tests/calls-mic-segments.regression.ts

      - name: Test Calls character-started calls
        run: npx tsx tests/calls-character-call.regression.ts

      - name: Test Calls release and SwarmUI video generation
        run: |
          node tests/conversation-calls-summary.regression.mjs
          node tests/calls-swarmui-video.regression.mjs

      - name: Test Memory Nag recall selection
        run: npx tsx tests/memory-nag-selection.regression.ts

      - name: Test Memory Nag ranges and Pixelforge weather contract
        run: |
          npx tsx tests/memory-nag-range.regression.ts
          node tests/pixelforge-weather-contract.regression.mjs

      - name: Test Relationship Tracker and Memory Nag reading Roleplay whispers
        run: npx tsx tests/roleplay-whispers.regression.ts

      - name: Test Pixelforge world, setup, and startup contracts
        run: |
          node packages/pixelforge/test-brief.mjs
          node tests/pixelforge-startup.regression.mjs

      - name: Test Beholder client bundle contract
        run: |
          npx tsx tests/beholder-client-contract.regression.ts
          npx tsx tests/beholder-host-release.regression.ts

      - name: Test Quartermaster dialogs and inventory export
        run: node tests/quartermaster-modal-lifecycle.regression.mjs

      - name: Test Gacha Forge location IDs and landscape layout
        run: node tests/gacha-forge-location-ids.regression.mjs

      # Prints how much of the reference extension's interface this package actually
      # renders. It is here so the number is read from a run rather than asserted from
      # memory — three separate claims of parity were wrong before this test existed.
      - name: Measure Beholder UI parity against the reference extension
        run: npx tsx tests/beholder-parity.regression.ts

      - name: Test vendored Engine drift detection
        run: node scripts/tests/vendored-engine.regression.mjs

      # Calls, Noodle and Slurp reach the Engine's live services through api.runtime instead of bundling copies
      # (sources/host-runtime-overlay). The gates fail a package server that ships a copy again.
      - name: Test the package server host runtime and its gates
        run: |
          node --experimental-transform-types tests/host-runtime-overlay.regression.mjs
          node scripts/tests/server-host-gates.regression.mjs
          node scripts/tests/server-singleton-gate.regression.mjs

      # Review fixes to the host de-duplication: Slurp's connection admission, the Calls volume and Local Model,
      # Noodle's picker scope and Long-Term Memory's guide pictures (the picture check needs an Engine checkout).
      - name: Test the host de-duplication review fixes
        run: node tests/dedup-review-fixes.regression.mjs

      - name: Test catalog lane routing and build provenance
        run: node scripts/test-catalog-lanes.mjs

      - name: Test Slurp unanswered follow-up control
        run: npx tsx --tsconfig tests/tsconfig.regressions.json tests/slurp2-pause-follow-ups-until-reply.regression.ts

      # These read scripts/build-feature-packages.mjs, which the Noodle and Slurp browser workflow
      # no longer triggers on. None of them needs an Engine checkout (the PR-checks job has none).
      - name: Test Slurp builder text assertions
        run: |
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/slurp-generation-integrations.regression.ts
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/slurp2-architecture.regression.ts
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/slurp2-slice-i.regression.ts
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/slurp2-step1-shell.regression.ts

      - name: Validate package localization catalogs
        run: |
          node scripts/tests/ui-translation-retention.regression.mjs
          node scripts/validate-package-locales.mjs

      # A package bundles shared Engine components but owns its locale catalog, so a component from
      # a shared folder can ship with no strings and render raw key names to users.
      - name: Validate bundled localization keys resolve
        run: node scripts/validate-package-locale-keys.mjs

      - name: Validate catalogs, packages, artifacts, and README coverage
        run: node scripts/validate-catalog.mjs

      # Package clients use the Engine's host namespace (__MARINARA_HOST__) instead of bundled copies (#1478, #1487).
      - name: Test the Engine-owned browser storage gate
        run: node scripts/tests/host-storage-key-gate.regression.mjs

      - name: Test the host client adapters packages bundle
        run: node tests/host-client-adapters.regression.mjs

      - name: Test the host module shims and their export check
        run: node scripts/tests/host-module-shims.regression.mjs

      - name: Test the client bundle host gates
        run: node scripts/tests/client-host-gates.regression.mjs

      - name: Test catalog generatedAt determinism
        run: node scripts/tests/catalog-generatedat-determinism.regression.mjs

      - name: Test package release notes
        run: node scripts/tests/catalog-release-notes.regression.mjs

      # A ruleset package ships no Agent, so the catalog's agent-definition checks
      # are skipped for it and this contract is the only thing holding its shape.
      - name: Test ruleset package contract
        run: node scripts/tests/ruleset-package.regression.mjs

      # The avatar packages are built ahead of the Engine surfaces that read them, so this holds their
      # agent definitions and generation prompts to the Engine's Capability API 1.73 contract.
      - name: Test avatar package contract
        run: node scripts/tests/avatar-package.regression.mjs

      - name: Test World Maps UI contracts and location limit
        run: |
          node tests/world-maps-ui-contract.regression.mjs
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/map-location-limit.regression.ts

      - name: Test Noodle timeline context budget, writer images and image prompts
        run: |
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/noodle-timeline-context-budget.regression.ts
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/noodle-writer-images.regression.ts
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/noodle-image-prompt-instructions.regression.ts

      - name: Test Long-Term Memory feedback clarity UI contracts
        run: node tests/long-term-memory-feedback-clarity-ui.regression.mjs

      - name: Test Long-Term Memory Engine-free regressions
        run: |
          npx tsx tests/long-term-memory-scope-targets.regression.ts
          npx tsx tests/long-term-memory-scope-fallback-labels.regression.ts
          npx tsx tests/long-term-memory-tab-keys.regression.ts
          npx tsx tests/long-term-memory-review-queue-ambiguous-link.regression.ts
          npx tsx tests/long-term-memory-source-task.regression.ts
          npx tsx tests/long-term-memory-source-pagination.regression.ts
          npx tsx tests/long-term-memory-debug-activity.regression.ts

      - name: Validate pull request gate topology
        run: node scripts/validate-pr-triage.mjs

      - name: Test owner approval evaluator
        run: node scripts/test-owner-approval.mjs

      - name: Check whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --check "origin/${BASE_REF}...HEAD"
