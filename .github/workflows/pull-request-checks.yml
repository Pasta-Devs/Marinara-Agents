name: Pull Request Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: agent-catalog-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  catalog-validate:
    name: Catalog validation
    runs-on: ubuntu-latest
    # Recent runs take 100–150 s (the serial job's median was 199 s); a stall should fail here, not at GitHub's
    # six-hour default.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run check

      - name: Check package source names
        run: npm run typecheck:packages

      # The regressions and validators below are independent of each other and write only under the system temp
      # directory, so they run concurrently, one per core (#1579). Each command's output is printed as its own log
      # group when it finishes; a failed command is printed expanded with an error annotation, and every command
      # still runs so one job shows every failure.
      - name: Test and validate the packages, catalog and repository gates
        run: |
          node scripts/run-parallel.mjs <<'COMMANDS'
          node scripts/tests/typecheck-packages-missing-tsc.regression.mjs
          npm run test:security

          # Calls: autoplay recovery, speech-to-text server fallback and speech queue, mic clips and media uploads,
          # character-started calls, release and SwarmUI video generation.
          npx tsx tests/calls-playback.regression.ts
          npx tsx tests/calls-speech-to-text.regression.ts
          npx tsx tests/calls-mic-segments.regression.ts
          npx tsx tests/calls-character-call.regression.ts
          node tests/conversation-calls-summary.regression.mjs
          node tests/calls-swarmui-video.regression.mjs

          # Memory Nag recall selection and ranges, the Pixelforge weather contract, and Relationship Tracker and
          # Memory Nag reading Roleplay whispers.
          npx tsx tests/memory-nag-selection.regression.ts
          npx tsx tests/memory-nag-range.regression.ts
          node tests/pixelforge-weather-contract.regression.mjs
          npx tsx tests/roleplay-whispers.regression.ts

          # Pixelforge world, setup, and startup contracts.
          node packages/pixelforge/test-brief.mjs
          node tests/pixelforge-startup.regression.mjs

          # Beholder client bundle contract and host release.
          npx tsx tests/beholder-client-contract.regression.ts
          npx tsx tests/beholder-host-release.regression.ts

          # Quartermaster dialogs and inventory export; Gacha Forge layout, canonical choices and reproducible bundles.
          node tests/quartermaster-modal-lifecycle.regression.mjs
          node tests/gacha-forge-location-ids.regression.mjs
          node tests/gacha-forge-player-choices.regression.mjs
          node tests/gacha-forge-audio.regression.mjs
          node tests/gacha-forge-music-prompts.regression.mjs
          node tests/gacha-forge-achievements.regression.mjs
          node tests/gacha-forge-bundle-rebuild.regression.mjs
          node tests/gacha-forge-story-memory.regression.mjs
          node tests/gacha-forge-story-memory-integration.regression.mjs
          node tests/gacha-forge-story-reset-barrier.regression.mjs
          node tests/gacha-forge-chapter-regeneration.regression.mjs
          node tests/gacha-forge-chapter-regeneration-client.regression.mjs
          node tests/gacha-forge-chapter-regeneration-package.regression.mjs
          node tests/gacha-forge-story-memory-fit.regression.mjs
          node tests/gacha-forge-story-memory-client.regression.mjs
          node tests/gacha-forge-story-memory-package.regression.mjs

          # Prints how much of the reference extension's interface the Beholder package actually
          # renders. It is here so the number is read from a run rather than asserted from
          # memory — three separate claims of parity were wrong before this test existed.
          npx tsx tests/beholder-parity.regression.ts

          # Vendored Engine drift detection.
          node scripts/tests/vendored-engine.regression.mjs

          # Calls, Noodle and Slurp reach the Engine's live services through api.runtime instead of bundling copies
          # (sources/host-runtime-overlay). The gates fail a package server that ships a copy again.
          node --experimental-transform-types tests/host-runtime-overlay.regression.mjs
          node scripts/tests/server-host-gates.regression.mjs
          node scripts/tests/server-singleton-gate.regression.mjs

          # Review fixes to the host de-duplication: Slurp's connection admission, the Calls volume and Local Model,
          # Noodle's picker scope and Long-Term Memory's guide pictures (the picture check needs an Engine checkout).
          node tests/dedup-review-fixes.regression.mjs

          # Catalog lane routing and build provenance.
          node scripts/test-catalog-lanes.mjs

          # Slurp unanswered follow-up control.
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/slurp2-pause-follow-ups-until-reply.regression.ts

          # Slurp builder text assertions. These read scripts/build-feature-packages.mjs, which the Noodle and Slurp
          # browser workflow no longer triggers on. None of them needs an Engine checkout (the PR-checks job has none).
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/slurp-generation-integrations.regression.ts
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/slurp2-architecture.regression.ts
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/slurp2-slice-i.regression.ts
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/slurp2-step1-shell.regression.ts

          # Package localization catalogs.
          node scripts/tests/ui-translation-retention.regression.mjs
          node scripts/validate-package-locales.mjs

          # A package bundles shared Engine components but owns its locale catalog, so a component from
          # a shared folder can ship with no strings and render raw key names to users.
          node scripts/validate-package-locale-keys.mjs

          # Catalogs, packages, artifacts, and README coverage.
          node scripts/validate-catalog.mjs

          # Package clients use the Engine's host namespace (__MARINARA_HOST__) instead of bundled copies (#1478, #1487):
          # the Engine-owned browser storage gate, the host client adapters bundle, the host module shims and their
          # export check, and the client bundle host gates.
          node scripts/tests/host-storage-key-gate.regression.mjs
          node tests/host-client-adapters.regression.mjs
          node scripts/tests/host-module-shims.regression.mjs
          node scripts/tests/client-host-gates.regression.mjs

          # Catalog generatedAt determinism and package release notes.
          node scripts/tests/catalog-generatedat-determinism.regression.mjs
          node scripts/tests/catalog-release-notes.regression.mjs

          # A ruleset package ships no Agent, so the catalog's agent-definition checks
          # are skipped for it and this contract is the only thing holding its shape.
          node scripts/tests/ruleset-package.regression.mjs

          # The avatar packages are built ahead of the Engine surfaces that read them, so this holds their
          # agent definitions and generation prompts to the Engine's Capability API 1.73 contract.
          node scripts/tests/avatar-package.regression.mjs

          # World Maps UI contracts and location limit.
          node tests/world-maps-ui-contract.regression.mjs
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/map-location-limit.regression.ts

          # Noodle timeline context budget, writer images and image prompts.
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/noodle-timeline-context-budget.regression.ts
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/noodle-writer-images.regression.ts
          npx tsx --tsconfig tests/tsconfig.regressions.json tests/noodle-image-prompt-instructions.regression.ts

          # Long-Term Memory feedback clarity UI contracts and Engine-free regressions.
          node tests/long-term-memory-feedback-clarity-ui.regression.mjs
          npx tsx tests/long-term-memory-scope-targets.regression.ts
          npx tsx tests/long-term-memory-scope-fallback-labels.regression.ts
          npx tsx tests/long-term-memory-tab-keys.regression.ts
          npx tsx tests/long-term-memory-review-queue-ambiguous-link.regression.ts
          npx tsx tests/long-term-memory-source-task.regression.ts
          npx tsx tests/long-term-memory-source-pagination.regression.ts
          npx tsx tests/long-term-memory-debug-activity.regression.ts

          # Pull request gate topology and the owner approval evaluator.
          node scripts/validate-pr-triage.mjs
          node scripts/test-owner-approval.mjs
          COMMANDS

      - name: Check whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --check "origin/${BASE_REF}...HEAD"
