name: Pull Request Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: agent-catalog-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  catalog-validate:
    name: Catalog validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run check

      - name: Test package security invariants
        run: npm run test:security

      - name: Test Memory Nag recall selection
        run: npx tsx tests/memory-nag-selection.regression.ts

      - name: Test Beholder client bundle contract
        run: npx tsx tests/beholder-client-contract.regression.ts

      - name: Test catalog lane routing and build provenance
        run: node scripts/test-catalog-lanes.mjs

      - name: Validate package localization catalogs
        run: node scripts/validate-package-locales.mjs

      - name: Validate catalogs, packages, artifacts, and README coverage
        run: node scripts/validate-catalog.mjs

      - name: Test catalog generatedAt determinism
        run: node scripts/tests/catalog-generatedat-determinism.regression.mjs

      - name: Test World Maps UI contracts
        run: node tests/world-maps-ui-contract.regression.mjs

      - name: Test Long-Term Memory feedback clarity UI contracts
        run: node tests/long-term-memory-feedback-clarity-ui.regression.mjs

      - name: Validate pull request gate topology
        run: node scripts/validate-pr-triage.mjs

      - name: Test owner approval evaluator
        run: node scripts/test-owner-approval.mjs

      - name: Check whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --check "origin/${BASE_REF}...HEAD"
