name: Noodle and Slurp Package Browser

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/noodle-browser.yml"
      - "artifacts/noodle-*.zip"
      - "artifacts/slurp-*.zip"
      - "artwork/agent-covers/noodle.png"
      - "artwork/agent-covers/slurp.png"
      - "artwork/sources/noodle-*"
      - "artwork/sources/slurp-*"
      # NOTE: intentionally NOT triggering on catalog/*.json, package.json, or
      # package-lock.json. Those are shared across every package — each release
      # regenerates the catalog and can touch the lockfile — so triggering on them
      # ran this Noodle/Slurp browser suite on unrelated package PRs. Noodle/Slurp
      # changes are already covered by packages/noodle|slurp/**, the noodle/slurp
      # artifacts, the harness scripts, and sources/engine below.
      - "packages/noodle/**"
      - "packages/slurp/**"
      - "scripts/build-feature-packages.mjs"
      - "scripts/install-package-browser-fixture.mjs"
      - "scripts/run-package-browser-tests.mjs"
      - "scripts/start-package-browser-servers.mjs"
      - "sources/engine/**"
      - "tests/package-noodle.e2e.ts"
      - "tests/package-slurp.e2e.ts"
      - "tests/playwright.package.config.ts"

concurrency:
  group: noodle-browser-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  noodle-browser:
    name: Noodle package browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout Marinara Agents
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Marinara Engine staging
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Pasta-Devs/Marinara-Engine
          ref: staging
          path: engine
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          package_json_file: engine/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install package runner dependencies
        run: npm ci

      - name: Install Engine dependencies
        run: pnpm --dir engine install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Rebuild the Noodle and Slurp artifacts
        env:
          MARINARA_ENGINE_ROOT: ${{ github.workspace }}/engine
        run: node scripts/build-feature-packages.mjs noodle slurp

      - name: Run package-owned Noodle browser suite
        env:
          MARINARA_ENGINE_ROOT: ${{ github.workspace }}/engine
        run: npm run test:browser:noodle

      - name: Run package-owned Slurp browser suite
        env:
          MARINARA_ENGINE_ROOT: ${{ github.workspace }}/engine
        run: npm run test:browser:slurp
