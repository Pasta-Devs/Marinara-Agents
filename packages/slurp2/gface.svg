<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1254 1254"
     width="1254" height="1254">
  <title>Gunterlie — concept-faithful vector</title>
  <desc>
    Vector traced from the approved concept image.
    Animation-ready parts: locks, head shape, left brow, right brow, moustache and beard.
  </desc>

  <style>
    .anim-part {
      transform-box: fill-box;
      transform-origin: center;
    }

    /* Subtle hair movement */
    #locks {
      transform-box: fill-box;
      transform-origin: 50% 70%;
      animation: hair-sway 2.6s ease-in-out infinite alternate;
    }

    @keyframes hair-sway {
      0%   { transform: rotate(-0.8deg) translateY(0px) scaleX(1); }
      50%  { transform: rotate(0.45deg) translateY(-1.5px) scaleX(1.006); }
      100% { transform: rotate(0.8deg) translateY(0px) scaleX(0.997); }
    }

    /* Existing expressive motion */
    #moustache {
      transform-box: fill-box;
      transform-origin: center;
      animation: moustache-twitch 1.1s ease-in-out infinite alternate;
    }

    #brow-left {
      transform-box: fill-box;
      transform-origin: center;
      animation: brow-left-move 1.25s ease-in-out infinite alternate;
    }

    #brow-right {
      transform-box: fill-box;
      transform-origin: center;
      animation: brow-right-move 1.25s ease-in-out infinite alternate;
    }

    @keyframes moustache-twitch {
      0%   { transform: rotate(-1.5deg) scaleX(1); }
      45%  { transform: rotate(1deg) scaleX(1.025); }
      100% { transform: rotate(-0.5deg) scaleX(.985); }
    }

    @keyframes brow-left-move {
      from { transform: translateY(0px) rotate(-2deg); }
      to   { transform: translateY(-8px) rotate(3deg); }
    }

    @keyframes brow-right-move {
      from { transform: translateY(0px) rotate(2deg); }
      to   { transform: translateY(-8px) rotate(-3deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #locks, #moustache, #brow-left, #brow-right { animation: none; }
    }
  </style>
